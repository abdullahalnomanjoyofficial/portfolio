<?xml version="1.0" encoding="UTF-8"?>
<!-- Wordless animated cyber logo — no text, neon/cyberpunk style -->
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="120" viewBox="0 0 600 120" role="img" aria-label="Brand symbol">
  <defs>
    <linearGradient id="neon" x1="0" x2="1">
      <stop offset="0%" stop-color="#00ffd1" />
      <stop offset="50%" stop-color="#7df2ff" />
      <stop offset="100%" stop-color="#ff27b0" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="transparent" />

  <!-- left emblem: concentric rings + circuit bars -->
  <g transform="translate(80,60)">
    <circle r="44" fill="none" stroke="url(#neon)" stroke-width="2" stroke-opacity="0.12" />
    <g filter="url(#glow)">
      <circle r="34" fill="none" stroke="url(#neon)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 8">
        <animate attributeName="stroke-dashoffset" from="0" to="100" dur="6s" repeatCount="indefinite" />
      </circle>
      <g transform="rotate(0)">
        <rect x="-3" y="-28" width="6" height="18" rx="2" fill="url(#neon)">
          <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite" />
        </rect>
      </g>
      <g transform="rotate(60)">
        <rect x="-3" y="-28" width="6" height="12" rx="2" fill="#0ff" opacity="0.8" />
      </g>
      <g transform="rotate(120)">
        <rect x="-3" y="-28" width="6" height="22" rx="2" fill="#ff5" opacity="0.7" />
      </g>
    </g>
  </g>

  <!-- neon circuit mark on right, symmetric abstract -->
  <g transform="translate(200,30) scale(1.2)">
    <path d="M30 10 C10 10, 10 50, 30 50" fill="none" stroke="url(#neon)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dashoffset" values="0;60;0" dur="5s" repeatCount="indefinite" />
    </path>
    <circle cx="30" cy="10" r="3" fill="url(#neon)">
      <animate attributeName="r" values="3;6;3" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <rect x="10" y="34" width="36" height="6" rx="3" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- subtle scanning line -->
  <rect x="0" y="0" width="600" height="120" fill="url(#neon)" opacity="0">
    <animate attributeName="opacity" values="0;0.02;0" dur="6s" repeatCount="indefinite" />
  </rect>

</svg>
